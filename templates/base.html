<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.S.D. - Lifting Statistical Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .navbar {
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
        }
        .navbar-brand {
            color: #ffffff !important;
            font-weight: bold;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }
        .nav-link {
            color: #aaaaaa !important;
        }
        .nav-link:hover {
            color: #ffffff !important;
        }
        .nav-link.active {
            color: #ffffff !important;
        }
        .card {
            background-color: #1f1f1f;
            border: 1px solid #333;
            color: #e0e0e0;
        }
        .card-header {
            background-color: #2a2a2a;
            border-bottom: 1px solid #333;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn-primary {
            background-color: #444;
            border-color: #555;
        }
        .btn-primary:hover {
            background-color: #555;
            border-color: #666;
        }
        .btn-danger {
            background-color: #7a1f1f;
            border-color: #8a2020;
        }
        .btn-danger:hover {
            background-color: #8a2020;
        }
        .form-control, .form-select {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #e0e0e0;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2a2a2a;
            border-color: #666;
            color: #e0e0e0;
            box-shadow: none;
        }
        .table {
            color: #e0e0e0;
        }
        .table-dark {
            --bs-table-bg: #1f1f1f;
            --bs-table-striped-bg: #2a2a2a;
            --bs-table-border-color: #333;
        }
        .form-control::placeholder {
            color: #aaaaaa;
            opacity: 1;
        }
        hr {
            border-color: #333;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1f1f1f;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #555;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="/home">L.S.D.</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            {% if session.get("user_id") %}
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/run' %}active{% endif %}" href="/run">Run Program</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/manage' %}active{% endif %}" href="/manage">Manage Programs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/logs' %}active{% endif %}" href="/logs">Logs</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link text-secondary">{{ session.get("username") }}</span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="/settings">Settings</a>
                    </li>
                </ul>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        L.S.D. — Lifting Statistical Database &nbsp;|&nbsp; For lifters who want to see everything. &nbsp;|&nbsp; <a href="/about" class="text-secondary">About</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
